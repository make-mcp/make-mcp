name: Release

# Publishes all packages to npm when a version tag (v1.2.3) is pushed.
# Uses npm trusted publishing (OIDC) – no NPM_TOKEN secret needed. Each package must list this
# workflow as trusted publisher on npmjs.com (Settings → Trusted publisher → GitHub Actions).

on:
  push:
    tags: ["v*"]
  # Manual run: checks npm's trusted-publishing token exchange per package (prints status and error only).
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trusted publishing token exchange
        run: |
          id_token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          for p in core mcp-server cli; do
            code=$(curl -sS -o body.json -w '%{http_code}' -X POST -H "Authorization: Bearer $id_token" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@make-mcp%2f$p")
            echo "@make-mcp/$p: HTTP $code $(jq -c 'del(.token)' body.json 2>/dev/null)"
          done

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: false
      - run: npm install -g npm@11
      - run: npm ci
      - name: Check tag matches pinned versions
        run: node scripts/set-version.mjs --check "${GITHUB_REF_NAME#v}"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      # Skips versions that are already on npm, so a failed release can simply be re-run.
      - name: Publish
        shell: bash
        run: |
          set -o pipefail
          for p in core mcp-server cli; do
            v=$(node -p "require('./packages/$p/package.json').version")
            if npm view "@make-mcp/$p@$v" version >/dev/null 2>&1; then echo "@make-mcp/$p@$v already published"; continue; fi
            # Fresh publishes are staged by npm for a few minutes; a re-run then gets a 409 for that version.
            if ! npm publish -w "@make-mcp/$p" 2>&1 | tee publish.log; then exit 1; fi
            if grep -q "Cannot publish over previously" publish.log; then echo "@make-mcp/$p@$v already staged"; continue; fi
            if grep -q "npm error" publish.log; then exit 1; fi
          done
